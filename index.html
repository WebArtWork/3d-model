<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Модель — Переглядач</title>
<style>
  :root {
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #12141a;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #viewer {
    position: fixed;
    inset: 0;
  }
  #viewer canvas {
    display: block;
    outline: none;
  }
  #ui {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    pointer-events: none;
    gap: 12px;
    z-index: 10;
  }
  .panel {
    pointer-events: auto;
    background: rgba(20, 22, 28, 0.72);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 14px 18px;
    color: #eaeaf0;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  #title-panel h1 {
    margin: 0 0 2px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }
  #title-panel p {
    margin: 0;
    font-size: 12px;
    color: #9aa0ac;
  }
  #controls-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 220px;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
  }
  .row label {
    color: #c4c8d2;
  }
  button {
    background: #2a2d38;
    color: #eaeaf0;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
    transition: background .15s ease;
  }
  button:hover {
    background: #363a48;
  }
  button.primary {
    background: #4b6bfb;
    border-color: #4b6bfb;
  }
  button.primary:hover {
    background: #5c79ff;
  }
  input[type="range"] {
    width: 110px;
  }
  input[type="file"] {
    display: none;
  }
  #drop-hint {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(20, 30, 60, 0.55);
    color: #fff;
    font-size: 22px;
    z-index: 20;
    pointer-events: none;
    border: 3px dashed rgba(255,255,255,0.6);
  }
  #drop-hint.active {
    display: flex;
  }
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    background: #12141a;
    z-index: 30;
    color: #eaeaf0;
    transition: opacity .3s ease;
  }
  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .spinner {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #4b6bfb;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  #progress-text {
    font-size: 13px;
    color: #9aa0ac;
  }
  #model-list {
    position: fixed;
    bottom: 16px;
    left: 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    max-width: calc(100% - 32px);
    z-index: 10;
  }
  .model-chip {
    pointer-events: auto;
    background: rgba(20, 22, 28, 0.72);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 12px;
    color: #c4c8d2;
    cursor: pointer;
  }
  .model-chip.active {
    background: #4b6bfb;
    color: #fff;
    border-color: #4b6bfb;
  }
  #crosshair {
    position: fixed;
    top: 50%;
    left: 50%;
    width: 6px;
    height: 6px;
    margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    box-shadow: 0 0 3px rgba(0,0,0,0.6);
    display: none;
    z-index: 15;
    pointer-events: none;
  }
  #crosshair.active {
    display: block;
  }
  #walk-instructions {
    position: fixed;
    bottom: 16px;
    right: 16px;
    display: none;
    z-index: 25;
    pointer-events: auto;
  }
  #walk-instructions.show {
    display: block;
  }
  #walk-instructions .box {
    position: relative;
    background: rgba(20, 22, 28, 0.9);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    padding: 16px 34px 16px 18px;
    color: #eaeaf0;
    text-align: left;
    max-width: 280px;
    line-height: 1.6;
    font-size: 13px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    cursor: pointer;
  }
  #walk-instructions .box b {
    color: #7c93ff;
  }
  #walk-instructions .close-hint {
    position: absolute;
    top: 8px;
    right: 10px;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    color: #9aa0ac;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
  }
  #walk-instructions .close-hint:hover {
    background: rgba(255,255,255,0.08);
    color: #eaeaf0;
  }
</style>
</head>
<body>

<div id="viewer"></div>

<div id="loading">
  <div class="spinner"></div>
  <div id="progress-text">Завантаження моделі…</div>
</div>

<div id="drop-hint">Відпустіть файл, щоб завантажити модель (.glb / .gltf)</div>

<div id="crosshair"></div>
<div id="walk-instructions">
  <div class="box" id="walk-instructions-box">
    <span class="close-hint" id="walk-instructions-close" title="Закрити">✕</span>
    Клікніть на сцену, щоб зайти в будинок<br>
    <b>W A S D</b> — рух, <b>миша</b> — огляд<br>
    <b>Shift</b> — біг, <b>Esc</b> — призупинити
  </div>
</div>

<div id="ui">
  <div class="panel" id="title-panel">
    <h1 id="model-name">3D Переглядач</h1>
    <p>Обертання — ЛКМ, панорама — ПКМ, масштаб — колесо<br>Подвійний клік по кімнаті — перейти туди</p>
  </div>

  <div class="panel" id="controls-panel">
    <div class="row">
      <label>Автообертання</label>
      <input type="checkbox" id="auto-rotate">
    </div>
    <div class="row">
      <label>Каркас (wireframe)</label>
      <input type="checkbox" id="wireframe">
    </div>
    <div class="row">
      <label>Яскравість</label>
      <input type="range" id="exposure" min="0" max="2" step="0.05" value="1">
    </div>
    <div class="row">
      <label>Мій зріст</label>
      <input type="range" id="eye-height" min="0.4" max="2.2" step="0.02" value="1.7">
    </div>
    <div class="row">
      <button id="reset-view">Скинути вигляд</button>
      <button id="upload-btn" class="primary">Завантажити .glb/.gltf</button>
    </div>
    <div class="row">
      <button id="walk-toggle" class="primary" style="width:100%">Режим прогулянки (WASD)</button>
    </div>
    <input type="file" id="file-input" accept=".glb,.gltf" multiple>
  </div>
</div>

<div id="model-list"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const viewerEl = document.getElementById('viewer');
const loadingEl = document.getElementById('loading');
const progressText = document.getElementById('progress-text');
const dropHint = document.getElementById('drop-hint');
const modelNameEl = document.getElementById('model-name');
const modelListEl = document.getElementById('model-list');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12141a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
camera.position.set(4, 2.5, 6);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
viewerEl.appendChild(renderer.domElement);

const pmremGenerator = new THREE.PMREMGenerator(renderer);
scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 0.1;
controls.maxDistance = 200;

const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444455, 0.6);
scene.add(hemiLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
dirLight.position.set(5, 10, 7);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.near = 0.5;
dirLight.shadow.camera.far = 50;
scene.add(dirLight);

const grid = new THREE.GridHelper(20, 20, 0x333844, 0x22252e);
grid.position.y = 0;
scene.add(grid);

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);

let currentModel = null;
let defaultCameraState = null;
let collidableMeshes = [];

function updateCollidableMeshes() {
  collidableMeshes = [];
  if (currentModel) {
    currentModel.traverse((c) => { if (c.isMesh) collidableMeshes.push(c); });
  }
}

// ---- Режим прогулянки (WASD, від першої особи, з гравітацією) ----
const plControls = new PointerLockControls(camera, renderer.domElement);
const crosshairEl = document.getElementById('crosshair');
const walkInstructionsEl = document.getElementById('walk-instructions');
const walkInstructionsCloseEl = document.getElementById('walk-instructions-close');
const walkToggleBtn = document.getElementById('walk-toggle');
let walkHintDismissed = false;

walkInstructionsCloseEl.addEventListener('click', (e) => {
  e.stopPropagation();
  walkHintDismissed = true;
  walkInstructionsEl.classList.remove('show');
});

let walkMode = false;
let pointerLocked = false;
let eyeHeight = 1.7; // зріст людини — рівень очей над підлогою (авто-підбирається під масштаб моделі)
const walkSpeed = 2.6;
const runSpeed = 5.2;
const collisionRadius = 0.35;
const stepUpMargin = 0.4;     // на скільки промінь стартує вище ніг (дозволяє підйом на сходинку)
const stepDownRange = 0.6;    // на скільки нижче поточних ніг ще вважається "та ж підлога" (спуск сходами)
const gravity = 18;           // м/с² — прискорення падіння, коли підлоги немає під ногами
let verticalVelocity = 0;
const keyState = {};
const walkRaycaster = new THREE.Raycaster();
const clock = new THREE.Clock();

const eyeHeightSlider = document.getElementById('eye-height');
eyeHeightSlider.addEventListener('input', (e) => {
  const feetY = camera.position.y - eyeHeight;
  eyeHeight = parseFloat(e.target.value);
  camera.position.y = feetY + eyeHeight;
});

window.addEventListener('keydown', (e) => { keyState[e.code] = true; });
window.addEventListener('keyup', (e) => { keyState[e.code] = false; });

plControls.addEventListener('lock', () => {
  pointerLocked = true;
  walkInstructionsEl.classList.remove('show');
  crosshairEl.classList.add('active');
});
plControls.addEventListener('unlock', () => {
  pointerLocked = false;
  if (walkMode && !walkHintDismissed) walkInstructionsEl.classList.add('show');
});

renderer.domElement.addEventListener('click', () => {
  if (walkMode && !pointerLocked) plControls.lock();
});

function raycastDown(x, z, fromY, maxDepth) {
  walkRaycaster.set(new THREE.Vector3(x, fromY, z), new THREE.Vector3(0, -1, 0));
  walkRaycaster.far = maxDepth;
  return walkRaycaster.intersectObjects(collidableMeshes, false); // відсортовано від найближчого до найдальшого
}

function raycastUp(x, z, fromY, maxDepth) {
  walkRaycaster.set(new THREE.Vector3(x, fromY, z), new THREE.Vector3(0, 1, 0));
  walkRaycaster.far = maxDepth;
  return walkRaycaster.intersectObjects(collidableMeshes, false);
}

function enterWalkMode() {
  if (!currentModel) return;
  walkMode = true;
  walkHintDismissed = false;
  controls.enabled = false;
  verticalVelocity = 0;
  updateCollidableMeshes();

  // Стартуємо над центром будівлі й одразу шукаємо підлогу під цією точкою
  // (перший поверх, а не дах чи горище), щоб зайти всередину коректно.
  const box = new THREE.Box3().setFromObject(currentModel);
  const center = box.getCenter(new THREE.Vector3());

  // Промінь згори наскрізь через дах/стелі — беремо НАЙГЛИБШИЙ перетин
  // (останній по ходу променя), це і є підлога першого поверху/землі.
  let floorY = box.min.y;
  const hits = raycastDown(center.x, center.z, box.max.y + 1, box.max.y - box.min.y + 2);
  if (hits.length) floorY = hits[hits.length - 1].point.y;

  // Підбираємо зріст під реальну висоту стелі цієї кімнати (масштаб моделі
  // може не відповідати "справжнім" метрам), щоб не почуватись велетнем/карликом.
  const ceilingHits = raycastUp(center.x, center.z, floorY + 0.15, 20);
  if (ceilingHits.length) {
    const roomHeight = ceilingHits[0].point.y - floorY;
    eyeHeight = THREE.MathUtils.clamp(roomHeight * 0.8, 0.4, 2.2);
    eyeHeightSlider.value = eyeHeight.toFixed(2);
  }

  camera.position.set(center.x, floorY + eyeHeight, center.z);
  camera.up.set(0, 1, 0);
  camera.lookAt(new THREE.Vector3(center.x, floorY + eyeHeight, box.min.z));

  walkToggleBtn.textContent = 'Вийти з режиму прогулянки';
  walkInstructionsEl.classList.add('show');
}

function exitWalkMode() {
  walkMode = false;
  if (pointerLocked) plControls.unlock();
  walkInstructionsEl.classList.remove('show');
  crosshairEl.classList.remove('active');
  controls.enabled = true;
  walkToggleBtn.textContent = 'Режим прогулянки (WASD)';

  if (currentModel) {
    const box = new THREE.Box3().setFromObject(currentModel);
    controls.target.copy(box.getCenter(new THREE.Vector3()));
    controls.update();
  }
}

walkToggleBtn.addEventListener('click', () => {
  if (walkMode) exitWalkMode();
  else enterWalkMode();
});

function updateWalk(delta) {
  if (!walkMode || !pointerLocked) return;
  delta = Math.min(delta, 0.1); // захист від великих стрибків часу (перемикання вкладки і т.п.)

  const speed = (keyState['ShiftLeft'] || keyState['ShiftRight']) ? runSpeed : walkSpeed;
  const moveDistance = speed * delta;
  const prevPosition = camera.position.clone();

  // Рух вперед/назад/убік завжди горизонтальний (moveForward/moveRight у
  // PointerLockControls ігнорують нахил камери) — це і є "ходьба".
  if (keyState['KeyW'] || keyState['ArrowUp']) plControls.moveForward(moveDistance);
  if (keyState['KeyS'] || keyState['ArrowDown']) plControls.moveForward(-moveDistance);
  if (keyState['KeyD'] || keyState['ArrowRight']) plControls.moveRight(moveDistance);
  if (keyState['KeyA'] || keyState['ArrowLeft']) plControls.moveRight(-moveDistance);

  // Колізія зі стінами: перевіряємо кілька рівнів висоти (від ніг до голови),
  // щоб не можна було пройти крізь стіну ні внизу, ні вгорі.
  const moveVec = new THREE.Vector3(camera.position.x - prevPosition.x, 0, camera.position.z - prevPosition.z);
  const moveDist = moveVec.length();

  if (moveDist > 0.0001 && collidableMeshes.length) {
    const dir = moveVec.clone().normalize();
    const probeHeights = [-1.5, -0.7, 0.3];
    let blocked = false;
    for (const h of probeHeights) {
      walkRaycaster.set(new THREE.Vector3(prevPosition.x, prevPosition.y + h, prevPosition.z), dir);
      walkRaycaster.far = collisionRadius + moveDist;
      const hits = walkRaycaster.intersectObjects(collidableMeshes, false);
      if (hits.length && hits[0].distance < collisionRadius + moveDist) {
        blocked = true;
        break;
      }
    }
    if (blocked) {
      camera.position.x = prevPosition.x;
      camera.position.z = prevPosition.z;
    }
  }

  if (!collidableMeshes.length) return;

  // Ходьба/сходи: шукаємо підлогу в невеликому діапазоні навколо поточних ніг.
  const feetY = camera.position.y - eyeHeight;
  const stepHits = raycastDown(camera.position.x, camera.position.z, feetY + stepUpMargin, stepUpMargin + stepDownRange);

  if (stepHits.length) {
    camera.position.y = stepHits[0].point.y + eyeHeight;
    verticalVelocity = 0;
  } else {
    // Немає підлоги поруч (край балкона, дірка в підлозі) — падаємо, поки не знайдемо щось нижче.
    verticalVelocity -= gravity * delta;
    const fallHits = raycastDown(camera.position.x, camera.position.z, feetY, 500);
    const nextFeetY = feetY + verticalVelocity * delta;
    if (fallHits.length && fallHits[0].point.y >= nextFeetY) {
      camera.position.y = fallHits[0].point.y + eyeHeight;
      verticalVelocity = 0;
    } else {
      camera.position.y = nextFeetY + eyeHeight;
    }
  }
}

const builtInModels = [
  { name: 'Будинок (стартова модель)', url: './models_extracted/scene.gltf' }
];

function frameObject(object, offsetScale = 1.4) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  const fov = camera.fov * (Math.PI / 180);
  let cameraDist = (maxDim / 2) / Math.tan(fov / 2);
  cameraDist *= offsetScale;

  const direction = new THREE.Vector3(1, 0.6, 1).normalize();
  camera.position.copy(center.clone().add(direction.multiplyScalar(cameraDist)));
  camera.near = maxDim / 100;
  camera.far = maxDim * 100;
  camera.updateProjectionMatrix();

  controls.target.copy(center);
  controls.update();

  defaultCameraState = {
    position: camera.position.clone(),
    target: controls.target.clone()
  };
}

function clearCurrentModel() {
  if (currentModel) {
    scene.remove(currentModel);
    currentModel.traverse((child) => {
      if (child.isMesh) {
        child.geometry?.dispose();
        if (Array.isArray(child.material)) {
          child.material.forEach(m => m.dispose());
        } else {
          child.material?.dispose();
        }
      }
    });
    currentModel = null;
  }
}

function setLoading(isLoading, text) {
  loadingEl.classList.toggle('hidden', !isLoading);
  if (text) progressText.textContent = text;
}

function loadModelFromUrl(url, displayName) {
  setLoading(true, `Завантаження: ${displayName}…`);
  loader.load(
    url,
    (gltf) => {
      clearCurrentModel();
      currentModel = gltf.scene;
      currentModel.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      scene.add(currentModel);
      frameObject(currentModel);
      updateCollidableMeshes();
      modelNameEl.textContent = displayName;
      setLoading(false);
    },
    (xhr) => {
      if (xhr.total) {
        const pct = Math.round((xhr.loaded / xhr.total) * 100);
        progressText.textContent = `Завантаження: ${displayName}… ${pct}%`;
      }
    },
    (err) => {
      console.error('Помилка завантаження моделі:', err);
      setLoading(true, 'Помилка завантаження моделі. Перевірте консоль.');
    }
  );
}

function loadModelFromFiles(fileList) {
  const files = Array.from(fileList);
  const mainFile = files.find(f => f.name.toLowerCase().endsWith('.gltf') || f.name.toLowerCase().endsWith('.glb'));
  if (!mainFile) {
    alert('Оберіть файл .glb або .gltf');
    return;
  }

  setLoading(true, `Завантаження: ${mainFile.name}…`);

  const urlMap = new Map();
  files.forEach(f => urlMap.set(f.name, URL.createObjectURL(f)));

  const manager = new THREE.LoadingManager();
  manager.setURLModifier((url) => {
    const cleanName = decodeURIComponent(url.split('/').pop());
    if (urlMap.has(cleanName)) return urlMap.get(cleanName);
    return url;
  });

  const localLoader = new GLTFLoader(manager);
  localLoader.setDRACOLoader(dracoLoader);

  const mainUrl = urlMap.get(mainFile.name);
  localLoader.load(
    mainUrl,
    (gltf) => {
      clearCurrentModel();
      currentModel = gltf.scene;
      currentModel.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      scene.add(currentModel);
      frameObject(currentModel);
      updateCollidableMeshes();
      modelNameEl.textContent = mainFile.name;
      setLoading(false);
      addModelChip(mainFile.name, () => loadModelFromFiles(fileList), true);
    },
    undefined,
    (err) => {
      console.error('Помилка завантаження моделі:', err);
      setLoading(true, 'Помилка завантаження моделі. Перевірте консоль.');
    }
  );
}

function addModelChip(name, onClick, makeActive) {
  const existing = Array.from(modelListEl.children).find(c => c.textContent === name);
  if (existing) {
    if (makeActive) setActiveChip(existing);
    return;
  }
  const chip = document.createElement('div');
  chip.className = 'model-chip';
  chip.textContent = name;
  chip.addEventListener('click', () => {
    onClick();
    setActiveChip(chip);
  });
  modelListEl.appendChild(chip);
  if (makeActive) setActiveChip(chip);
}

function setActiveChip(chip) {
  Array.from(modelListEl.children).forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
}

builtInModels.forEach((m, i) => {
  addModelChip(m.name, () => loadModelFromUrl(m.url, m.name), i === 0);
});
loadModelFromUrl(builtInModels[0].url, builtInModels[0].name);

document.getElementById('auto-rotate').addEventListener('change', (e) => {
  controls.autoRotate = e.target.checked;
  controls.autoRotateSpeed = 2;
});

document.getElementById('wireframe').addEventListener('change', (e) => {
  if (!currentModel) return;
  currentModel.traverse((child) => {
    if (child.isMesh) {
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach(m => { if (m) m.wireframe = e.target.checked; });
    }
  });
});

document.getElementById('exposure').addEventListener('input', (e) => {
  renderer.toneMappingExposure = parseFloat(e.target.value);
});

document.getElementById('reset-view').addEventListener('click', () => {
  if (defaultCameraState) {
    camera.position.copy(defaultCameraState.position);
    controls.target.copy(defaultCameraState.target);
    controls.update();
  }
});

// Подвійний клік у звичайному (орбітальному) режимі — переміщує камеру ближче
// до точки кліку, щоб зручно "переходити" з кімнати в кімнату крізь дверні
// прорізи, не покладаючись лише на зум/панораму.
const teleportRaycaster = new THREE.Raycaster();
renderer.domElement.addEventListener('dblclick', (e) => {
  if (!currentModel) return;

  // У режимі прогулянки миша заблокована (pointer lock), тож приціл — завжди
  // центр екрана (хрестик), а не координати курсора.
  if (walkMode && pointerLocked) {
    teleportRaycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const hits = teleportRaycaster.intersectObjects(collidableMeshes, false);
    if (!hits.length) return;

    const hitPoint = hits[0].point;
    camera.position.x = hitPoint.x;
    camera.position.z = hitPoint.z;
    camera.position.y = hitPoint.y + eyeHeight;
    verticalVelocity = 0;
    return;
  }

  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  teleportRaycaster.setFromCamera(ndc, camera);

  const hits = teleportRaycaster.intersectObjects(collidableMeshes, false);
  if (!hits.length) return;

  const hitPoint = hits[0].point;
  const dir = hitPoint.clone().sub(camera.position).normalize();
  const travelBack = 1.4; // залишаємось трохи перед точкою кліку, а не в стіні
  const newTarget = hitPoint.clone();
  const newPosition = hitPoint.clone().sub(dir.multiplyScalar(travelBack));

  controls.target.copy(newTarget);
  camera.position.copy(newPosition);
  controls.update();
});

const fileInput = document.getElementById('file-input');
document.getElementById('upload-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length) loadModelFromFiles(e.target.files);
});

let dragCounter = 0;
window.addEventListener('dragenter', (e) => {
  e.preventDefault();
  dragCounter++;
  dropHint.classList.add('active');
});
window.addEventListener('dragleave', (e) => {
  e.preventDefault();
  dragCounter--;
  if (dragCounter <= 0) dropHint.classList.remove('active');
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  dragCounter = 0;
  dropHint.classList.remove('active');
  if (e.dataTransfer.files.length) loadModelFromFiles(e.dataTransfer.files);
});

// Плавний зум колесом миші під час прогулянки (звужує/розширює поле зору,
// як оптичний зум) — окремо від зуму OrbitControls в звичайному режимі.
const baseFov = camera.fov;
renderer.domElement.addEventListener('wheel', (e) => {
  if (!walkMode) return;
  e.preventDefault();
  const zoomStep = e.deltaY * 0.02;
  camera.fov = THREE.MathUtils.clamp(camera.fov + zoomStep, 15, baseFov);
  camera.updateProjectionMatrix();
}, { passive: false });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (walkMode) {
    updateWalk(delta);
  } else {
    controls.update();
  }
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
